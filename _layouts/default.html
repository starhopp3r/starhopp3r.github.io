<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfcfb">
  {% seo %}
  {% feed_meta %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png?v=3' | relative_url }}">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="{{ '/assets/img/favicons/favicon.ico?v=3' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png?v=3' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicons/favicon-16x16.png?v=3' | relative_url }}">
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/assets/img/favicons/brand-mark.svg?v=3' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest?v=3' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/dm-sans/normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {% if page.layout == 'post' %}
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4/normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {% endif %}
  <script>
    (() => {
      let stored;
      try { stored = localStorage.getItem('theme-preference'); } catch (_) {}
      const theme = ['light', 'dark'].includes(stored) ? stored : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141619' : '#fcfcfb';
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.mathjax %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true,
          processEnvironments: true
        },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  {% endif %}
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
<body id="top" class="page page-{{ page.layout | default: 'default' }}{% if page.url == '/' %} page-home{% endif %}">
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about' | relative_url }}" {% if page.layout == 'about' %}aria-current="page"{% endif %}>About</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch color theme" hidden>
          <span class="icon-moon">{% include icons/moon.svg %}</span>
          <span class="icon-sun">{% include icons/sun.svg %}</span>
        </button>
      </nav>
    </header>
    <main id="main" class="page-content">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Nikhil Raghavendra</span>
      <nav aria-label="Footer">
        <a href="https://github.com/starhopp3r">GitHub</a>
        <a href="https://www.linkedin.com/in/nikrag/">LinkedIn</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </footer>
  </div>
  {% if page.layout == 'post' %}<script src="{{ '/assets/js/table-merge.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
